<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Fusion — Multi-Provider</title>
<style>
  /* ===== dark theme ===== */
  :root {
    /* 配色参考 AIFusion_logo.jpg（深蓝灰 #23262F 家族 + 亮蓝 accent） */
    --bg: #10131a;
    --surface: #171b24;
    --surface2: #1f2430;
    --border: #2b3140;
    --text: #e8ecf5;
    --text2: #9aa3b5;
    --accent: #5b8cff;
    --accent2: #7aa8ff;
    --user-bubble: #1d2a44;
    --tool-bg: #141924;
    --tool-border: #2b3140;
    --error: #e0556a;
    --success: #4caf93;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #app { display: flex; flex-direction: column; height: 100%; }

  #header img#app-logo {
    width: 22px; height: 22px; object-fit: cover; border-radius: 6px;
    box-shadow: 0 0 0 1px rgba(91,140,255,.35);
  }
  #header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  #header svg { width: 22px; height: 22px; flex-shrink: 0; }
  #header .title { font-weight: 600; font-size: 13px; }
  #header .badge {
    margin-left: auto; font-size: 10px; padding: 2px 8px;
    border-radius: 99px; background: var(--surface2);
    color: var(--text2); cursor: pointer;
    border: 1px solid var(--border); white-space: nowrap;
  }
  #header .badge:hover { background: var(--border); }
  #header .badge.configured { color: var(--success); border-color: var(--success); }

  #messages {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 100%; animation: msgIn 0.15s ease-out; }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-self: flex-end; max-width: 88%; }
  .msg.user .bubble {
    background: var(--user-bubble); border: 1px solid #3a2050;
    border-radius: var(--radius) var(--radius) 2px var(--radius);
    padding: 8px 12px; color: #e8d0f8;
  }

  .msg.assistant { align-self: flex-start; max-width: 92%; }
  .msg.assistant .bubble {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) var(--radius) 2px;
    padding: 10px 12px; white-space: pre-wrap; word-break: break-word;
  }
  .msg.assistant .bubble p { margin: 0 0 6px; }
  .msg.assistant .bubble p:last-child { margin-bottom: 0; }
  .msg.assistant .bubble code { background: var(--surface2); padding: 1px 5px; border-radius: 3px; font-size: 12px; }
  .msg.assistant .bubble pre { background: var(--surface2); padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 11px; margin: 6px 0; }

  .tool-call {
    align-self: flex-start; max-width: 94%;
    background: var(--tool-bg); border: 1px solid var(--tool-border);
    border-radius: var(--radius); padding: 8px 10px; font-size: 12px;
  }
  .tool-call .tool-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .tool-call .tool-name { font-weight: 600; color: var(--accent2); }
  .tool-call .tool-args { color: var(--text2); font-size: 11px; }
  .tool-call .tool-result {
    margin-top: 6px; padding: 6px 8px; background: var(--surface);
    border-radius: 6px; font-size: 11px; max-height: 160px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all;
    color: var(--text2); border: 1px solid var(--border);
  }
  .tool-call .tool-result.error { color: var(--error); border-color: #4a2030; }
  .tool-call .tool-result.ok { color: var(--success); }

  #input-area { flex-shrink: 0; padding: 8px 10px; background: var(--surface); border-top: 1px solid var(--border); }
  #input-area form { display: flex; gap: 6px; }
  #prompt {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px 12px; color: var(--text);
    font-size: 13px; font-family: inherit; resize: none; outline: none;
    min-height: 36px; max-height: 120px; line-height: 1.4;
  }
  #prompt:focus { border-color: var(--accent); }
  #send-btn {
    flex-shrink: 0; width: 36px; height: 36px; border: none;
    border-radius: var(--radius); background: var(--accent); color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  #send-btn:hover { background: var(--accent2); }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #status { display: none; padding: 4px 12px; background: #1a1020; border-top: 1px solid #3a2050; font-size: 11px; color: var(--text2); text-align: center; flex-shrink: 0; }
  #status.visible { display: block; }

  /* ── Settings overlay ── */
  #settings {
    display: none; position: absolute; top: 44px; bottom: 60px; left: 0; right: 0;
    background: var(--bg); z-index: 10; overflow-y: auto; padding: 16px;
    flex-direction: column; gap: 10px;
  }
  #settings.open { display: flex; }
  #settings label {
    font-size: 11px; color: var(--text2); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: -6px;
  }
  #settings select, #settings input, #settings textarea {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; color: var(--text);
    font-size: 13px; font-family: inherit; width: 100%;
  }
  #settings textarea { min-height: 80px; resize: vertical; font-size: 12px; }
  #settings .btn-row { display: flex; gap: 8px; margin-top: 4px; }
  #settings .btn {
    flex: 1; padding: 8px; border: none; border-radius: 6px;
    font-size: 13px; cursor: pointer; font-weight: 600;
  }
  #settings .btn.save { background: var(--accent); color: #fff; }
  #settings .btn.save:hover { background: var(--accent2); }
  #settings .btn.cancel { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

  /* Provider info row */
  #settings .info-row {
    display: flex; align-items: center; gap: 6px; font-size: 11px;
  }
  #settings .info-row .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  #settings .info-row .dot.ok { background: var(--success); }
  #settings .info-row .dot.missing { background: var(--error); }

  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; color: var(--text2); text-align: center; gap: 8px; padding: 20px;
  }
  .empty-state h2 { font-size: 15px; font-weight: 600; color: var(--text); }
  .empty-state p { font-size: 12px; max-width: 300px; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── Attachments ── */
  .attach-controls { display: flex; align-items: center; gap: 8px; padding: 4px 4px 2px; }
  .attach-btn { background: var(--panel2, #2a2f3a); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 12px; padding: 3px 10px; cursor: pointer; }
  .attach-btn:hover { border-color: var(--accent, #4c8dff); }
  .attach-count { font-size: 11px; color: var(--text2); }
  .attach-preview { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px; }
  .attach-chip { display: flex; align-items: center; gap: 6px; background: var(--panel2, #2a2f3a); border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px; max-width: 200px; }
  .attach-chip img { width: 28px; height: 28px; object-fit: cover; border-radius: 4px; background: #fff; }
  .attach-chip .file-ic { font-size: 18px; }
  .attach-chip .name { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attach-chip .rm { cursor: pointer; font-size: 12px; color: var(--text2); border: 0; background: transparent; padding: 0 2px; }
  .attach-chip .rm:hover { color: var(--error, #e5484d); }
  .badge-attach { display: inline-block; background: var(--panel2, #2a2f3a); border: 1px solid var(--border); border-radius: 6px; font-size: 11px; padding: 1px 6px; margin-right: 6px; }

  /* ===== reliability cards (AI CAD 可靠性中间层) ===== */
  .r-card {
    background: #14161c; border: 1px solid #2a2e3a; border-radius: 10px;
    padding: 10px 12px; margin: 8px 0; font-size: 12.5px; line-height: 1.5;
  }
  .r-title { font-weight: 700; margin-bottom: 4px; }
  .r-sub { color: var(--text2, #99a); margin-bottom: 6px; }
  .r-table { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 12px; }
  .r-table th, .r-table td { border: 1px solid #2a2e3a; padding: 3px 6px; text-align: left; }
  .r-table th { background: #1c1f27; }
  .r-btn {
    background: var(--accent, #4a6cf7); color: #fff; border: 0; border-radius: 6px;
    padding: 5px 10px; font-size: 12px; cursor: pointer; margin: 4px 6px 2px 0;
  }
  .r-btn:hover { background: var(--accent2, #3b5bdb); }
  .r-btn.ghost { background: transparent; border: 1px solid #3a3f4d; color: #c9cdd8; }
  .r-q { color: #e8b34b; margin-top: 6px; }
  .r-q-item { margin: 3px 0; }
  .r-risk-low { color: #4ade80; } .r-risk-medium { color: #facc15; } .r-risk-high { color: #f87171; }
  .r-status-passed { color: #4ade80; font-weight: 600; }
  .r-status-failed { color: #f87171; font-weight: 600; }
  .r-status-paused { color: #facc15; font-weight: 600; }
  .r-state { float: right; font-size: 11px; color: var(--text2, #99a); }

  /* (移除 Tab 面板: 设计规格/参数/执行计划/验证-BOM) */
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div id="header">
    <img id="app-logo" src="/static/AIFusion_logo.jpg"
         alt="AI Fusion" title="AI Fusion — AI Copilot" />
    <span class="title">AI Fusion</span>
    <span id="model-badge" class="badge" title="Open settings">⚙ …</span>
  </div>

  <div id="chat-region"></div>

  <div id="messages">
    <div class="empty-state" id="empty-state">
      <h2>AI Fusion — Multi-Provider</h2>
      <p>6 providers supported: DeepSeek · Kimi · GLM · OpenAI · Claude · Gemini</p>
    </div>
  </div>

  <div id="status">Thinking...</div>

  <div id="input-area">
    <form id="chat-form" autocomplete="off">
      <div id="attach-preview" class="attach-preview"></div>
      <div class="attach-controls">
        <button type="button" id="attach-btn" class="attach-btn" title="添加附件（图片或 PDF，单张 ≤8MB，最多 4 个）">📎 附件</button>
        <span id="attach-count" class="attach-count"></span>
        <input type="file" id="attach-input" accept="image/*,.pdf" multiple hidden />
      </div>
      <textarea id="prompt" rows="1" placeholder="Describe what you want to do..." spellcheck="false"></textarea>
      <button id="send-btn" type="submit" title="Send (Enter)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </form>
  </div>

  <!-- ── Settings overlay (dynamic per provider) ── -->
  <div id="settings">
    <label>Provider</label>
    <select id="cfg-provider">
      <option value="deepseek">DeepSeek</option>
      <option value="kimi">Kimi (Moonshot)</option>
      <option value="zhipu">Zhipu GLM</option>
      <option value="openai">OpenAI</option>
      <option value="anthropic">Anthropic Claude</option>
      <option value="google_gemini">Google Gemini</option>
    </select>

    <div id="cfg-info" class="info-row"></div>

    <label>Model</label>
    <select id="cfg-model"></select>

    <label id="cfg-apikey-label">API Key</label>
    <input type="password" id="cfg-apikey" placeholder="sk-..." />

    <label>Base URL</label>
    <input type="text" id="cfg-baseurl" placeholder="https://..." />

    <label>
      <input type="checkbox" id="cfg-vision-check" checked />
      设计完成后自动截图视觉校验
    </label>

    <label>System Prompt</label>
    <textarea id="cfg-system-prompt" placeholder="System instructions for the AI..." rows="4"></textarea>

    <div class="btn-row">
      <button class="btn cancel" id="settings-cancel">Cancel</button>
      <button class="btn save" id="settings-save">Save</button>
    </div>
  </div>
</div>

<script>
// ============================================================================
// AI Fusion — Multi-Provider Chat UI
//
// Key features:
//  - Dynamic provider switching (6 providers)
//  - Per-provider model list, API key field, base URL
//  - Backward compatible with the existing /api/chat and /api/config endpoints
// ============================================================================

(function () {
  "use strict";

  // ── DOM refs ──
  const messagesEl   = document.getElementById("messages");
  const emptyState   = document.getElementById("empty-state");
  const statusEl     = document.getElementById("status");
  const promptEl     = document.getElementById("prompt");
  const formEl       = document.getElementById("chat-form");
  const sendBtn      = document.getElementById("send-btn");
  const modelBadge   = document.getElementById("model-badge");
  const settingsEl   = document.getElementById("settings");

  // ── State ──
  let conversation = [];
  let isProcessing = false;
  let providersMeta = {};  // fetched from /api/models
  let attachments = [];    // {name, mime, dataUrl, size}
  const ATTACH_MAX = 4;
  const ATTACH_MAX_BYTES = 8 * 1024 * 1024;

  // ── Vision check (screenshot → multimodal verification) ──
  const VISION_MAX_ROUNDS = 3;
  const VISION_CHECK_PROMPT = `你拿到的是 Fusion 当前设计的视口截图，请进行视觉粗校验。对照用户最初的设计要求和你此前给出的 CAD BRIEF（尺寸、特征、外观），检查：
1. 几何形态与预期是否一致（有无多余或缺失的特征，比例是否明显失调）；
2. 实体是否完整、位置是否正确；
3. 是否需要修复优化。

结论必须二选一：
- 基本符合预期 → 直接输出最终总结（包含尺寸、特征清单、验证结果）；
- 不符合 → 说明具体问题，继续用 execute 工具修复模型（修复后模型会再次截图校验，最多 ${VISION_MAX_ROUNDS} 轮）。

只依据截图与已执行的建模记录判断，不要凭空猜测尺寸。`;

  // ── API ──
  const API_BASE = window.location.origin;

  async function apiCall(method, path, body) {
    const opts = { method, headers: { "Content-Type": "application/json" } };
    if (body) opts.body = JSON.stringify(body);
    const resp = await fetch(API_BASE + path, opts);
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
    return data;
  }

  // ── Vision helpers ──
  function modelSupportsVision(pid, model) {
    const pmeta = providersMeta[pid];
    if (!pmeta) return false;
    if (pmeta.vision_all) return true;
    return (pmeta.vision_models || []).includes(model);
  }
  function visionCheckEnabled() {
    const el = document.getElementById("cfg-vision-check");
    return !el || el.checked;
  }
  function isScreenshotResult(r) {
    return r && typeof r === "object" && !Array.isArray(r) &&
           r.type === "image" && typeof r.mimeType === "string" &&
           typeof r.data === "string" && r.data.length > 0;
  }
  function buildVisionCheckMessage(r) {
    return [
      { type: "text", text: VISION_CHECK_PROMPT },
      { type: "image_url", image_url: { url: `data:${r.mimeType};base64,${r.data}` } },
    ];
  }

  // ── Attachments (user-provided images/PDFs as reference) ──
  function handleAttachFiles(fileList) {
    const files = Array.from(fileList || []);
    for (const f of files) {
      const isImg = /^image\/(png|jpe?g|webp|gif)$/i.test(f.type);
      const isPdf = f.type === "application/pdf" || /\.pdf$/i.test(f.name);
      if (!isImg && !isPdf) { alert(`附件 "${f.name}" 类型不支持（仅图片/PDF）`); continue; }
      if (f.size > ATTACH_MAX_BYTES) { alert(`附件 "${f.name}" 超过 8MB，已跳过`); continue; }
      if (attachments.length >= ATTACH_MAX) { alert(`附件最多 ${ATTACH_MAX} 个`); break; }
      const reader = new FileReader();
      reader.onload = () => {
        attachments.push({ name: f.name, mime: isPdf ? "application/pdf" : f.type, dataUrl: reader.result, size: f.size });
        renderAttachments();
      };
      reader.readAsDataURL(f);
    }
  }

  function renderAttachments() {
    const box = document.getElementById("attach-preview");
    const cnt = document.getElementById("attach-count");
    if (!box) return;
    box.innerHTML = "";
    attachments.forEach((a, i) => {
      const chip = document.createElement("div");
      chip.className = "attach-chip";
      const isImg = (a.mime || "").startsWith("image/");
      chip.innerHTML = `${isImg ? `<img src="${a.dataUrl}" alt="">` : '<span class="file-ic">📄</span>'}
        <span class="name" title="${escapeHtml(a.name)}">${escapeHtml(a.name)}</span>
        <button class="rm" title="移除">✕</button>`;
      chip.querySelector(".rm").onclick = () => { attachments.splice(i, 1); renderAttachments(); };
      box.appendChild(chip);
    });
    if (cnt) cnt.textContent = attachments.length ? `${attachments.length}/${ATTACH_MAX}` : "";
  }

  function clearAttachments() { attachments = []; renderAttachments(); }

  // 附件 → 发送给模型的 user content（OpenAI 多模态格式数组 / 纯文本）
  function buildUserMessageContent(userText) {
    if (!attachments.length) return userText;
    const [prov, model] = modelBadge.dataset.active ? modelBadge.dataset.active.split("/") : [null, null];
    if (!modelSupportsVision(prov, model)) {
      const names = attachments.map(a => a.name).join("、");
      return `${userText}\n\n[附件提示] 用户附带了 ${attachments.length} 个附件（${names}），但当前模型 ${model || "未知"} 不支持图片输入，附件内容未发送。如需让 AI 查看图片，请切换到支持视觉的模型（Kimi K3 / GPT-5.6 / Claude Sonnet 5 / Gemini 3.7 Flash）。`;
    }
    return [
      ...attachments.map(a => ({ type: "image_url", image_url: { url: a.dataUrl } })),
      { type: "text", text: userText },
    ];
  }

  function renderUserBubble(userText) {
    let html = escapeHtml(userText && userText.trim() ? userText : "(仅附件)");
    if (attachments.length) {
      const chips = attachments.map(a => `<span class="badge-attach">📎 ${escapeHtml(a.name)}</span>`).join("");
      html += `<br>${chips}`;
    }
    return html;
  }

  // ── Fusion bridge ──
  function callFusionTool(toolName, args) {
    return new Promise((resolve) => {
      function doCall() {
        try {
          // CRITICAL: The .pyc execute handler expects args in format:
          // {featureType: "script", object: {script: "def run..."}}
          // NOT {featureType: "script", script: "def run..."}
          let bridgeArgs = args;
          if (toolName === "execute" && args.featureType) {
            bridgeArgs = { featureType: args.featureType };
            if (args.featureType === "script") {
              bridgeArgs.object = { script: args.script || "" };
            } else if (args.featureType === "document") {
              bridgeArgs.object = { action: args.action || "" };
            } else if (args.featureType === "object") {
              bridgeArgs.object = { fileId: args.fileId || "" };
            }
          }
          const payload = JSON.stringify({ name: toolName, args: bridgeArgs });
          const result = adsk.fusionSendData("tool.call", payload);
          if (result && typeof result.then === "function") {
            result.then(data => { try { resolve(JSON.parse(data)); } catch { resolve({raw:data}); } })
                   .catch(err => resolve({error: err.message}));
          } else {
            try { resolve(JSON.parse(result)); } catch { resolve({raw: result}); }
          }
        } catch (e) { resolve({error: e.message}); }
      }

      if (typeof adsk !== "undefined" && adsk.fusionSendData) {
        doCall();
      } else {
        // wait up to 3s for adsk
        let waited = 0;
        function poll() {
          waited += 100;
          if (typeof adsk !== "undefined" && adsk.fusionSendData) { doCall(); }
          else if (waited >= 3000) {
            resolve({_mock: true, message: `[Standalone] ${toolName} called.`});
          } else { setTimeout(poll, 100); }
        }
        setTimeout(poll, 50);
      }
    });
  }

  // ── Rendering ──
  function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }
  function hideEmptyState() { if (emptyState) emptyState.style.display = "none"; }
  function setStatus(t) { statusEl.textContent = t; statusEl.classList.add("visible"); }
  function clearStatus() { statusEl.classList.remove("visible"); }

  // ── Thinking 计时(任何等待状态都显示已耗时, 避免"看起来卡死")──
  let thinkBase = "";
  let thinkStart = 0;
  let thinkTimer = null;
  function setThinking(base) {
    clearThinkingTimer();
    thinkBase = base;
    thinkStart = Date.now();
    updateThinking();
    thinkTimer = setInterval(updateThinking, 5000);
  }
  function updateThinking() {
    const secs = ((Date.now() - thinkStart) / 1000) | 0;
    setStatus(`${thinkBase}… ${secs}s`);
  }
  function clearThinkingTimer() {
    if (thinkTimer) { clearInterval(thinkTimer); thinkTimer = null; }
  }
  function clearThinking() {
    clearThinkingTimer();
    thinkBase = "";
    thinkStart = 0;
    clearStatus();
  }
  function escapeHtml(s) {
    if (!s) return "";
    const d = document.createElement("div");
    d.appendChild(document.createTextNode(String(s)));
    return d.innerHTML;
  }

  function renderMarkdown(text) {
    if (!text) return "";
    let html = escapeHtml(text);
    html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code.trim()}</code></pre>`);
    html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
    html = html.split(/\n\n+/).map(p => `<p>${p.trim()}</p>`).join("");
    html = html.replace(/\n/g, "<br>");
    return html;
  }

  function addMessageEl(role, html) {
    hideEmptyState();
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.innerHTML = `<div class="bubble">${html}</div>`;
    messagesEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  function addToolCallEl(toolName, args, result, isError) {
    hideEmptyState();
    const div = document.createElement("div");
    div.className = "tool-call";

    let argsPreview = "";
    try {
      const s = JSON.stringify(args);
      argsPreview = escapeHtml(s.length > 200 ? s.slice(0, 200) + "…" : s);
    } catch { argsPreview = "(...)"; }

    let resultHtml = "";
    if (result && result._mock) {
      resultHtml = escapeHtml(result.message);
    } else {
      try {
        resultHtml = `<pre style="margin:0;white-space:pre-wrap;font-size:11px;max-height:200px;overflow-y:auto;">${escapeHtml(JSON.stringify(result, null, 2).slice(0,500))}</pre>`;
      } catch { resultHtml = "(unprintable)"; }
    }

    div.innerHTML = `
      <div class="tool-header"><span class="tool-name">🔧 ${escapeHtml(toolName)}</span></div>
      <div class="tool-args">${argsPreview}</div>
      <div class="tool-result ${isError?'error':'ok'}">${resultHtml}</div>`;
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function addThinkingEl(text) {
    hideEmptyState();
    const div = document.createElement("div");
    div.style.cssText = "color:var(--text2);font-size:11px;font-style:italic;padding:4px 0";
    div.textContent = text;
    messagesEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  // ── Conversation ──
  async function sendMessage(userText) {
    if (!userText.trim()) return;
    if (isProcessing) {
      statusEl.textContent = "⏳ 上一条任务仍在处理中，请等待完成…";
      statusEl.classList.add("visible");
      if (thinkTimer) { thinkStart = Date.now(); updateThinking(); }
      return;
    }
    const [curProv, curModel] = modelBadge.dataset.active ? modelBadge.dataset.active.split("/") : [null, null];
    if (attachments.length && !modelSupportsVision(curProv, curModel)) {
      alert("当前模型不支持图片输入，附件将不会发送给 AI。建议切换到支持视觉的模型（Kimi K3 / GPT-5.6 / Claude Sonnet 5 / Gemini 3.7 Flash），或仅回复文本。");
    }
    isProcessing = true;
    sendBtn.disabled = true;
    setThinking("Thinking");

    conversation.push({ role: "user", content: buildUserMessageContent(userText) });
    addMessageEl("user", renderUserBubble(userText));
    if (attachments.length) clearAttachments();

    try {
      await reliabilityFlow(userText);
    } catch (err) {
      console.error("[aifusion]", err);
      addMessageEl("assistant", `<span style="color:var(--error)">Error: ${escapeHtml(err.message)}</span>`);
    } finally {
      clearThinking();
      isProcessing = false;
      sendBtn.disabled = false;
      promptEl.focus();
    }
  }

  // ==========================================================================
  // 🔐 Reliability Flow — AI CAD 可靠性中间层 (MVP 渐进 UI)
  //   Intent → 澄清 → 参数表 → Plan → 审查 → 分步执行 → 验证 → 回滚
  // ==========================================================================
  let relSession = null;
  let lastSpecResp = null;

  function esc(s) { return escapeHtml(String(s == null ? "" : s)); }
  function riskCls(risk) { return "r-risk-" + (risk || "medium"); }

  async function relApi(path, body, method) {
    return await apiCall(method || "POST", "/api/reliability" + path, body);
  }

  async function reliabilityFlow(userText) {
    addMessageEl("assistant",
      `<div class="r-card">🔐 可靠设计模式已开启<br>正在 <b>解析设计意图</b>（LLM 结构化输出 + JSON Schema 校验；失败自动重试，最终回退规则引擎）…</div>`);
    scrollToBottom();
    // 会话复用: 已有会话则在原设计上下文上继续(保留已确认/锁定参数, 避免多轮澄清上下文丢失)
    const reuse = !!relSession;
    const sid = reuse ? relSession : (await relApi("/session", {})).session_id;
    if (!reuse) relSession = sid;
    let resp = null;
    const payload = { session_id: sid, user_text: userText, use_llm: true, language: "zh-CN" };
    if (reuse) payload.reuse_session = true;
    try {
      resp = await relApi("/intent/parse", payload);
    } catch (e) {
      payload.use_llm = false;
      resp = await relApi("/intent/parse", payload);
    }
    lastSpecResp = resp;
    renderIntentCard(resp, userText);
  }

  function defaultLabel(d) {
    if (d == null || d === "") return "";
    if (typeof d === "object") return (d.label || d.id || JSON.stringify(d)).toString();
    return String(d);
  }

  function renderIntentCard(resp, userText) {
    const spec = resp.spec || {};
    const params = spec.parameters || [];
    const qs = resp.questions || [];
    let html = `<div class="r-card">
      <div class="r-title">📋 设计规格（DesignSpec） <span class="r-state">${esc(resp.state || "")}</span></div>
      <div class="r-sub">${esc((spec.goal && spec.goal.summary) || userText || "")}</div>`;
    if (resp.metadata && resp.metadata.fallback) {
      html += `<div class="r-sub" style="color:#e8b34b">⚠ LLM 结构化输出未通过校验，已回退规则引擎：${esc(JSON.stringify(resp.metadata.llm_errors || "").slice(0, 160))}</div>`;
    }
    if (qs && qs.length) {
      html += `<div class="r-q">❓ 需要澄清（${qs.length} 个）：</div>`;
      for (const q of qs) {
        html += `<div class="r-q-item"><b>${esc(q.question)}</b><br>`;
        const opts = (q.options && q.options.length) ? q.options : [{ id: "custom", label: "自定义" }];
        for (const o of opts) {
          html += `<button class="r-btn ghost" data-role="clarify" data-qid="${esc(q.id)}" data-value="${esc(o.id)}">${esc(o.label)}</button>`;
        }
        if (q.default != null && q.default !== "") html += ` <span style="color:#9aa;font-size:11px">默认：${esc(defaultLabel(q.default))}</span>`;
        html += `</div>`;
      }
    }
    html += `<div class="r-sub" style="margin:6px 0">假设：${esc((spec.assumptions || []).join("；") || "无")}</div>
      <table class="r-table"><tr><th>参数</th><th>值</th><th>来源</th><th>置信度</th><th>状态</th></tr>`;
    for (const p of params) {
      html += `<tr><td>${esc(p.label || p.name)}<br><code>${esc(p.name)}</code></td>
        <td>${esc(p.value)} ${esc(p.unit || "")}</td><td>${esc(p.source)}</td>
        <td>${esc(p.confidence)}</td><td>${esc(p.status)}${p.locked ? " 🔒" : ""}</td></tr>`;
    }
    html += `</table>
      <button class="r-btn" data-role="gen-plan">① 生成执行计划 →</button></div>`;
    addMessageEl("assistant", html);
    scrollToBottom();
  }

  async function genPlan() {
    const resp = await relApi("/plan/generate", { session_id: relSession });
    // 409: 存在未解决的阻断性澄清 → 引导用户继续回答(不回 raw 错误)
    if (resp.error && /澄清/.test(resp.error)) {
      let spec = (lastSpecResp && lastSpecResp.spec) || {};
      try {
        const s2 = await relApi(`/spec/${relSession}`, null, "GET");
        if (s2 && !s2.error) spec = s2;
      } catch (e) { /* 忽略 */ }
      addMessageEl("assistant",
        `<div class="r-card" style="color:#e8b34b">⚠ 还有未解决的澄清问题，请先回答：</div>`);
      renderIntentCard({ spec, state: "CLARIFY", questions: resp.questions || [],
                         metadata: {} }, "");
      return;
    }
    const nodes = (resp.plan && resp.plan.nodes) || [];
    let html = `<div class="r-card">
      <div class="r-title">🗺 执行计划（Plan DAG） <span class="r-state">${esc(resp.state || "")}</span></div>`;
    for (const n of nodes) {
      const flag = (n.checkpoint ? " 🧷检查点" : "") + (n.requires_confirmation ? " ⚠️需确认" : "");
      html += `<div style="margin:4px 0">${n.order}. <span class="${riskCls(n.risk)}">[${esc(n.risk)}]</span> ${esc(n.label)}${flag}
        <div style="color:#9aa;font-size:11px">产出 ${esc((n.outputs || []).join(",") || n.type)} ｜ 验证：${esc(n.verification || "-")} ｜ 备选：${esc(n.alternative || "-")}</div></div>`;
    }
    html += `<button class="r-btn" data-role="approve-run">② 批准计划并执行 →</button>
      <button class="r-btn ghost" data-role="back-spec">← 返回设计规格</button></div>`;
    addMessageEl("assistant", html);
    scrollToBottom();
  }

  async function approveAndRun() {
    await relApi(`/plan/${relSession}/approve`, {});
    const resp = await relApi(`/execution/run_all/${relSession}`, {});
    renderExecutionCard(resp);
  }

  function renderExecutionCard(resp) {
    const ex = resp.execution || {};
    let html = `<div class="r-card">
      <div class="r-title">⚙️ 分步执行结果 <span class="r-state">${esc(resp.state || "")}</span></div>
      <div>通过：<span class="r-status-passed">${ex.passed || 0}</span> ｜ 失败：<span class="r-status-failed">${ex.failed || 0}</span></div>`;
    for (const s of ex.summary || []) {
      const ok = s.ok === true;
      html += `<div>• ${esc(s.node)}：${ok ? '<span class="r-status-passed">✓ 通过</span>' : '<span class="r-status-failed">✗ 失败</span> <span style="color:#9aa;font-size:11px">' + esc(s.error || s.reason || "") + '</span>'}
        ${s.awaiting_confirmation ? `<span class="r-status-paused">（等待确认）</span> <button class="r-btn" data-role="confirm-node" data-node="${esc(s.node)}">✓ 确认并执行</button>` : ""}</div>`;
    }
    if ((ex.failed || 0) > 0) {
      html += `<button class="r-btn" data-role="retry-failed">↻ 重试失败节点</button>`;
    }
    html += `<button class="r-btn" data-role="validate">③ 运行验证 →</button></div>`;
    addMessageEl("assistant", html);
    scrollToBottom();
  }

  async function retryFailed() {
    const resp = await relApi(`/execution/retry_failed/${relSession}`, {});
    renderExecutionCard({ execution: resp.retry, state: resp.state });
  }

  async function runValidation() {
    const g = await relApi(`/validate/geometry/${relSession}`, {});
    const i = await relApi(`/validate/intent/${relSession}`, {});
    renderValidation(g.report, i.report, g.state);
  }

  function renderValidation(geo, intent, state) {
    const checks = (geo.checks || []).concat((intent.checks || []));
    let html = `<div class="r-card">
      <div class="r-title">✅ 验证报告 <span class="r-state">${esc(state || "")}｜几何 ${esc(geo.status)} ｜意图 ${esc(intent.status)}</span></div>`;
    for (const c of checks) {
      const cls = c.status === "passed" ? "passed" : c.status === "failed" ? "failed" : "paused";
      html += `<div><span class="r-status-${cls}">${esc(c.status)}</span> ${esc(c.type)}：${esc(c.message)}
        ${c.actual != null && c.actual !== "" ? ` <span style="color:#9aa;font-size:11px">(实际 ${esc(c.actual)} / 期望 ${esc(c.expected)})</span>` : ""}</div>`;
    }
    html += `<button class="r-btn ghost" data-role="checkpoint-list">🧷 检查点 / 回滚</button>
      <button class="r-btn ghost" data-role="bom-view">🧾 BOM / 追溯</button></div>`;
    addMessageEl("assistant", html);
    scrollToBottom();
  }

  async function listCheckpoints() {
    const s = await relApi(`/session/${relSession}`, null, "GET");
    const cps = s.checkpoints || [];
    let html = `<div class="r-card"><div class="r-title">🧷 检查点（回滚） <span class="r-state">状态 ${esc(s.state)}</span></div>`;
    if (!cps.length) html += `<div style="color:#9aa">暂无检查点</div>`;
    for (const cp of cps) {
      html += `<div style="margin:4px 0">${esc(cp.id)} ${esc(cp.label)}
        <button class="r-btn ghost" data-role="rollback" data-ckpt="${esc(cp.id)}">↩ 回滚到此</button></div>`;
    }
    html += `</div>`;
    addMessageEl("assistant", html);
    scrollToBottom();
  }

  // 可靠卡片按钮事件（事件委托）
  messagesEl.addEventListener("click", async (e) => {
    const btn = e.target.closest && e.target.closest("[data-role]");
    if (!btn) return;
    const role = btn.dataset.role;
    btn.disabled = true;
    try {
      if (role === "clarify") {
        const r = await relApi("/clarify/answer",
          { session_id: relSession, answers: { [btn.dataset.qid]: btn.dataset.value } });
        lastSpecResp = r;
        renderIntentCard(r, "");
      } else if (role === "gen-plan") { await genPlan(); }
      else if (role === "approve-run") { await approveAndRun(); }
      else if (role === "retry-failed") { await retryFailed(); }
      else if (role === "confirm-node") {
        // 确认点放行并执行该节点
        const r = await relApi(`/execution/confirm/${relSession}/${btn.dataset.node}`, {});
        const executed = r.executed || {};
        const plan = r.plan || {};
        const summary = executed.ok === undefined
          ? [] : [{ node: btn.dataset.node, ok: executed.ok, error: executed.error || executed.reason }];
        renderExecutionCard({ execution: { passed: executed.ok ? 1 : 0, failed: executed.ok ? 0 : 1, summary },
                              state: executed.awaiting_confirmation ? "PAUSED" : "EXECUTING" });
        if (!executed.ok && executed.awaiting_confirmation) {
          addMessageEl("assistant", `<div class="r-card">${esc(executed.reason || "等待确认")}</div>`);
        }
      }
      else if (role === "validate") { await runValidation(); }
      else if (role === "checkpoint-list") { await listCheckpoints(); }
      else if (role === "bom-view") {
        const r = await relApi(`/bom/${relSession}`, null, "GET");
        const rows = r.bom || [];
        let h = `<div class="r-card"><div class="r-title">🧾 BOM / 追溯 <span class="r-state">${esc(r.backend || "")}</span></div>`;
        if (!rows.length) { h += `<div style="color:#9aa">暂无实体(BOM 为空)</div>`; }
        else {
          h += `<table class="r-table"><tr><th>实体</th><th>体积(mm³)</th><th>质量(g)</th><th>AI属性</th></tr>`;
          for (const row of rows) {
            const attrs = row.attributes || {};
            const ai = ["intent_id", "plan_node_id", "semantic_role", "created_by"]
              .filter(k => attrs[k]).map(k => `${k}=${attrs[k]}`).join(" ");
            h += `<tr><td>${esc(row.body_name || "")}</td><td>${esc(row.volume_mm3 ?? "-")}</td>
              <td>${esc(row.mass_g ?? "-")}</td><td style="font-size:11px">${esc(ai || "无")}</td></tr>`;
          }
          h += `</table>`;
        }
        h += `</div>`;
        addMessageEl("assistant", h);
        scrollToBottom();
      }
      else if (role === "rollback") {
        const r = await relApi(`/execution/rollback/${relSession}/${btn.dataset.ckpt}`, {});
        addMessageEl("assistant", `<div class="r-card">↩️ 回滚结果：${esc(JSON.stringify(r))}</div>`);
      }
      else if (role === "back-spec") {
        renderIntentCard(lastSpecResp || { spec: {}, state: "SPEC_READY", questions: [], metadata: {} }, "");
      }
    } catch (err) {
      console.error("[reliability]", err);
      addMessageEl("assistant", `<span style="color:var(--error)">可靠流程错误：${esc(err.message)}</span>`);
    } finally {
      btn.disabled = false;
      // refreshTabs 已移除
    }
  });

  async function runConversationLoop() {
    const MAX_ROUNDS = 10;
    let verifyRounds = 0;
    for (let round = 0; round < MAX_ROUNDS; round++) {
      setThinking(`Thinking (第 ${round + 1}/${MAX_ROUNDS} 轮)`);
      // Read current provider/model from badge for each API call
      const [prov, model] = modelBadge.dataset.active
        ? modelBadge.dataset.active.split("/")
        : [null, null];

      const body = { messages: conversation };
      if (prov) body.provider = prov;
      if (model) body.model = model;

      const response = await apiCall("POST", "/api/chat", body);
      const choice = response.choices?.[0];
      if (!choice) throw new Error("No response from AI");

      const msg = choice.message;

      // text response
      if (msg.content && !msg.tool_calls) {
        conversation.push({ role: "assistant", content: msg.content });
        addMessageEl("assistant", renderMarkdown(msg.content));
        return;
      }

      // tool calls
      if (msg.tool_calls && msg.tool_calls.length > 0) {
        conversation.push({ role: "assistant", content: msg.content || null, tool_calls: msg.tool_calls });

        for (const tc of msg.tool_calls) {
          const toolName = tc.function.name;
          let args;
          try { args = JSON.parse(tc.function.arguments || "{}"); } catch { args = {}; }

          setThinking(`Running ${toolName}`);
          const thinkingEl = addThinkingEl(`Running ${toolName}...`);

          let result, isError = false;
          try { result = await callFusionTool(toolName, args); }
          catch (err) { result = `Error: ${err.message}`; isError = true; }

          thinkingEl.remove();
          addToolCallEl(toolName, args, result, isError);

          const shot = isScreenshotResult(result);
          conversation.push({
            role: "tool",
            tool_call_id: tc.id,
            name: toolName,
            // 截图 base64 不直接塞进 tool 消息(体积大且会污染纯文本模型), 仅保留摘要
            content: shot
              ? `[screenshot captured: ${result.mimeType}, base64 ${result.data.length} chars]`
              : (typeof result === "string" ? result : JSON.stringify(result)),
          });

          // 视觉校验:截图结果 → 以带图 user 消息注入(仅视觉模型, 且限制轮数)
          if (shot && modelSupportsVision(prov, model) && visionCheckEnabled() &&
              verifyRounds < VISION_MAX_ROUNDS) {
            verifyRounds++;
            conversation.push({ role: "user", content: buildVisionCheckMessage(result) });
            addMessageEl("assistant", `<div style="color:var(--text2);font-size:11px;font-style:italic">🔍 已获取设计截图，模型开始视觉校验（${verifyRounds}/${VISION_MAX_ROUNDS}）…</div>`);
          }
        }
        setThinking("Thinking");
        continue;
      }

      if (msg.content) {
        conversation.push({ role: "assistant", content: msg.content });
        addMessageEl("assistant", renderMarkdown(msg.content));
        return;
      }
      throw new Error("Empty response");
    }

    // max rounds
    conversation.push({ role: "user", content: "Please summarize what you've done." });
    const final = await apiCall("POST", "/api/chat", { messages: conversation });
    const c = final.choices?.[0]?.message?.content || "Done.";
    conversation.push({ role: "assistant", content: c });
    addMessageEl("assistant", renderMarkdown(c));
  }

  // ── Settings / Provider UI ──
  function getCurrProvider() { return document.getElementById("cfg-provider").value; }

  function updateModelSelect() {
    const pid = getCurrProvider();
    const sel  = document.getElementById("cfg-model");
    sel.innerHTML = "";

    const pmeta = providersMeta[pid];
    if (pmeta && pmeta.models) {
      const currentModel = window._currentModel || pmeta.models[0];
      pmeta.models.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m; opt.textContent = m;
        if (m === currentModel) opt.selected = true;
        sel.appendChild(opt);
      });
    }
  }

  function updateProviderInfoRow() {
    const pid   = getCurrProvider();
    const pmeta = providersMeta[pid];
    const row   = document.getElementById("cfg-info");
    if (!pmeta) { row.innerHTML = ""; return; }

    const configured = pmeta.configured;
    const visionOK = modelSupportsVision(pid, document.getElementById("cfg-model").value || (pmeta.models || [])[0]) && visionCheckEnabled();
    row.innerHTML = `
      <span class="dot ${configured ? 'ok' : 'missing'}"></span>
      <span>${configured ? 'API key configured ✓' : 'No API key set — enter key below'}</span>
      ${visionOK ? '<span class="vision-badge">👁️ 支持视觉校验</span>'
                 : '<span class="vision-badge dim">视觉校验不可用（当前模型/开关）</span>'}
    `;
  }

  function updateApiKeyField() {
    const pid   = getCurrProvider();
    const pmeta = providersMeta[pid];
    const label = document.getElementById("cfg-apikey-label");
    const input = document.getElementById("cfg-apikey");
    const baseurl = document.getElementById("cfg-baseurl");

    if (pmeta) {
      label.textContent = `${pmeta.label} API Key`;
      input.placeholder = pid === "anthropic" ? "sk-ant-..." : pid === "google_gemini" ? "AIza..." : "sk-...";
      if (pmeta.base_url) baseurl.value = pmeta.base_url;
    }
  }

  async function loadSettings() {
    try {
      const cfg = await apiCall("GET", "/api/config");
      const modelsInfo = await apiCall("GET", "/api/models");
      providersMeta = modelsInfo.providers || {};

      window._currentModel = cfg.model || "";

      // Resolve default provider: config > auto-detected (sole configured) > hard-coded
      const defaultPid = cfg.provider || modelsInfo.default_provider || "deepseek";

      // Populate provider dropdown
      const provSel = document.getElementById("cfg-provider");
      provSel.innerHTML = "";
      Object.entries(providersMeta).forEach(([pid, pmeta]) => {
        const opt = document.createElement("option");
        opt.value = pid;
        opt.textContent = pmeta.label;
        if (pid === defaultPid) opt.selected = true;
        provSel.appendChild(opt);
      });

      updateModelSelect();
      updateProviderInfoRow();
      updateApiKeyField();

      // Load API key (from config for current provider)
      const pid = getCurrProvider();
      const pmeta = providersMeta[pid];
      if (pmeta) {
        const cfgKey = pmeta.config_key || `${pid}_api_key`;
        document.getElementById("cfg-apikey").value = cfg[cfgKey] || "";
      }

      document.getElementById("cfg-system-prompt").value = cfg.system_prompt || "";

    } catch (e) {
      console.warn("[aifusion] Could not load settings:", e);
    }
  }

  async function saveSettings() {
    const pid     = getCurrProvider();
    const pmeta   = providersMeta[pid];
    const cfgKey  = pmeta ? (pmeta.config_key || `${pid}_api_key`) : `${pid}_api_key`;
    const model   = document.getElementById("cfg-model").value;

    const updates = {
      provider: pid,
      model: model,
      system_prompt: document.getElementById("cfg-system-prompt").value,
    };
    updates[cfgKey] = document.getElementById("cfg-apikey").value;
    updates[`${pid}_base_url`] = document.getElementById("cfg-baseurl").value;

    try {
      await apiCall("POST", "/api/config", updates);
      settingsEl.classList.remove("open");

      // Update badge
      const label = pmeta ? pmeta.label : pid;
      modelBadge.textContent = `⚙ ${label}/${model}`;
      modelBadge.dataset.active = `${pid}/${model}`;
      modelBadge.classList.toggle("configured", !!updates[cfgKey]);

      // Reset conversation
      conversation = [];
      messagesEl.querySelectorAll(".msg, .tool-call").forEach(el => el.remove());
      if (emptyState) emptyState.style.display = "";
    } catch (err) { alert("Failed to save: " + err.message); }
  }

  // ── Event handlers ──
  formEl.addEventListener("submit", e => {
    e.preventDefault();
    const text = promptEl.value.trim();
    if (!text || isProcessing) return;
    promptEl.value = "";
    promptEl.style.height = "auto";
    sendMessage(text);
  });

  promptEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); formEl.dispatchEvent(new Event("submit")); }
  });
  promptEl.addEventListener("input", () => {
    promptEl.style.height = "auto";
    promptEl.style.height = Math.min(promptEl.scrollHeight, 120) + "px";
  });

  modelBadge.addEventListener("click", () => {
    settingsEl.classList.toggle("open");
    if (settingsEl.classList.contains("open")) loadSettings();
  });

  document.getElementById("cfg-provider").addEventListener("change", () => {
    updateModelSelect();
    updateProviderInfoRow();
    updateApiKeyField();
    // Reload config to show the right API key
    (async () => {
      try {
        const cfg = await apiCall("GET", "/api/config");
        const pid = getCurrProvider();
        const pmeta = providersMeta[pid];
        const cfgKey = pmeta ? (pmeta.config_key || `${pid}_api_key`) : `${pid}_api_key`;
        document.getElementById("cfg-apikey").value = cfg[cfgKey] || "";
      } catch {}
    })();
  });

  document.getElementById("settings-cancel").addEventListener("click", () => settingsEl.classList.remove("open"));
  document.getElementById("settings-save").addEventListener("click", saveSettings);

  // ── Init ──
  async function init() {
    try {
      // Restore vision-check toggle from localStorage
      const vc = document.getElementById("cfg-vision-check");
      if (vc) vc.checked = localStorage.getItem("aifusion_vision") !== "0";
      vc?.addEventListener("change", () => {
        localStorage.setItem("aifusion_vision", vc.checked ? "1" : "0");
        updateProviderInfoRow();
      });
      document.getElementById("cfg-model")?.addEventListener("change", () => updateProviderInfoRow());

      // Attachment controls
      document.getElementById("attach-btn")?.addEventListener("click", () => document.getElementById("attach-input")?.click());
      document.getElementById("attach-input")?.addEventListener("change", (e) => {
        handleAttachFiles(e.target.files);
        e.target.value = "";
      });

      const modelsInfo = await apiCall("GET", "/api/models");
      providersMeta = modelsInfo.providers || {};

      // Priority: config.stored_provider > auto-detected (sole configured) > hard-coded
      const defaultPid = modelsInfo.default_provider || "deepseek";
      const configuredCount = modelsInfo.configured_count || 0;

      // If only one provider has a key, auto-select it regardless of cfg.provider
      let pid;
      if (configuredCount === 1 && defaultPid) {
        pid = defaultPid;  // sole configured provider wins
      } else {
        pid = defaultPid;  // use whatever resolution gave us
      }

      const pmeta = providersMeta[pid] || {};
      // 徽标显示【配置中保存的模型】(而非提供商首个模型), 与设置面板一致
      const cfgModel = window._currentModel || "";
      const model = (pmeta.models && pmeta.models.includes(cfgModel))
        ? cfgModel : ((pmeta.models && pmeta.models[0]) || "");
      const label = pmeta.label || pid;
      const configured = pmeta.configured || false;

      modelBadge.textContent = configured
        ? `⚙ ${label}/${model}`
        : `⚙ ${configuredCount === 0 ? "No API key set" : label + "/" + model}`;
      modelBadge.dataset.active = `${pid}/${model}`;
      modelBadge.classList.toggle("configured", configured);
    } catch (e) {
      console.warn("[aifusion] Init failed:", e);
    }
  }
  init();
})();
</script>
</body>
</html>
